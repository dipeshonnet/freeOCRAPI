<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-label="A local document workflow."><title>A local document workflow.</title><desc>Capabilities are explicit. Missing confidence, quota and usage values remain unknown.</desc><rect width="1200" height="510" rx="28" fill="#0b0b0d"/><g font-family="Arial,Helvetica,sans-serif"><text x="44" y="51" fill="#8b8b94" font-size="14" font-weight="600">freeOCRAPI / LOCAL-FIRST DOCUMENT PROCESSING</text><text x="44" y="108" fill="#fafafa" font-size="36" font-weight="700">A local document workflow.</text><text x="44" y="146" fill="#a6a6ad" font-size="18" font-weight="400">Capabilities are explicit. Missing confidence, quota and usage values remain unknown.</text><rect x="44" y="184" width="356" height="126" rx="20" fill="#151518" stroke="#303036"/><text x="64" y="216" fill="#ffffff" font-size="15" font-weight="700">01 / INGEST</text><text x="64" y="250" fill="#a6a6ad" font-size="16" font-weight="400">PDF, PNG, JPEG, WebP, TIFF</text><text x="64" y="278" fill="#a6a6ad" font-size="15" font-weight="400">Local preprocessing and page selection</text><rect x="422" y="184" width="356" height="126" rx="20" fill="#151518" stroke="#303036"/><text x="442" y="216" fill="#ffffff" font-size="15" font-weight="700">02 / ROUTE</text><text x="442" y="250" fill="#a6a6ad" font-size="16" font-weight="400">One engine; sequential safe failover</text><text x="442" y="278" fill="#a6a6ad" font-size="15" font-weight="400">Persisted jobs and provider operations</text><rect x="800" y="184" width="356" height="126" rx="20" fill="#151518" stroke="#303036"/><text x="820" y="216" fill="#ffffff" font-size="15" font-weight="700">03 / EXPORT</text><text x="820" y="250" fill="#a6a6ad" font-size="16" font-weight="400">Text, Markdown, JSON and table CSV</text><text x="820" y="278" fill="#a6a6ad" font-size="15" font-weight="400">Page provenance and result inspection</text><rect x="44" y="332" width="356" height="126" rx="20" fill="#151518" stroke="#303036"/><text x="64" y="364" fill="#ffffff" font-size="15" font-weight="700">04 / PROTECT</text><text x="64" y="398" fill="#a6a6ad" font-size="16" font-weight="400">AES-256-GCM provider credentials</text><text x="64" y="426" fill="#a6a6ad" font-size="15" font-weight="400">Bearer API key; separate admin session</text><rect x="422" y="332" width="356" height="126" rx="20" fill="#151518" stroke="#303036"/><text x="442" y="364" fill="#ffffff" font-size="15" font-weight="700">05 / INTEGRATE</text><text x="442" y="398" fill="#a6a6ad" font-size="16" font-weight="400">REST, MCP, CLI and Python</text><text x="442" y="426" fill="#a6a6ad" font-size="15" font-weight="400">LlamaIndex / LangChain / Haystack</text><rect x="800" y="332" width="356" height="126" rx="20" fill="#151518" stroke="#303036"/><text x="820" y="364" fill="#ffffff" font-size="15" font-weight="700">06 / OPERATE</text><text x="820" y="398" fill="#a6a6ad" font-size="16" font-weight="400">Encrypted backups and retention</text><text x="820" y="426" fill="#a6a6ad" font-size="15" font-weight="400">Optional caps, cache and health status</text></g></svg>
