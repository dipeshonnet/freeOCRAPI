<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="405" viewBox="0 0 1200 405" role="img" aria-label="Your documents. One OCR gateway."><title>Your documents. One OCR gateway.</title><desc>Run locally. Add providers when you need them. Keep every result traceable.</desc><rect width="1200" height="405" rx="28" fill="#0b0b0d"/><g font-family="Arial,Helvetica,sans-serif"><text x="44" y="51" fill="#8b8b94" font-size="14" font-weight="600">freeOCRAPI / LOCAL-FIRST DOCUMENT PROCESSING</text><text x="44" y="108" fill="#fafafa" font-size="36" font-weight="700">Your documents. One OCR gateway.</text><text x="44" y="146" fill="#a6a6ad" font-size="18" font-weight="400">Run locally. Add providers when you need them. Keep every result traceable.</text><rect x="44" y="190" width="260" height="145" rx="20" fill="#151518" stroke="#303036"/><text x="68" y="260" fill="#ffffff" font-size="54" font-weight="700">10</text><text x="68" y="305" fill="#b8b8c0" font-size="14" font-weight="600">ADAPTERS</text><rect x="328" y="190" width="260" height="145" rx="20" fill="#151518" stroke="#303036"/><text x="352" y="260" fill="#ffffff" font-size="54" font-weight="700">5</text><text x="352" y="305" fill="#b8b8c0" font-size="14" font-weight="600">INPUT FORMATS</text><rect x="612" y="190" width="260" height="145" rx="20" fill="#151518" stroke="#303036"/><text x="636" y="260" fill="#ffffff" font-size="54" font-weight="700">4</text><text x="636" y="305" fill="#b8b8c0" font-size="14" font-weight="600">EXPORT FORMATS</text><rect x="896" y="190" width="260" height="145" rx="20" fill="#151518" stroke="#303036"/><text x="920" y="260" fill="#ffffff" font-size="54" font-weight="700">1</text><text x="920" y="305" fill="#b8b8c0" font-size="14" font-weight="600">ENGINE PER DOCUMENT</text><text x="44" y="374" fill="#a6a6ad" font-size="17" font-weight="400">Default upload: 50 MB / 100 pages  ·  Built-in English Tesseract runs offline</text></g></svg>
