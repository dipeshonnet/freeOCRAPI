ight="700">Cloud</text><text x="632" y="270" fill="#a6a6ad" font-size="16" font-weight="400">6 provider adapters</text><text x="632" y="310" fill="#a6a6ad" font-size="16" font-weight="400">Provider service</text><text x="632" y="350" fill="#a6a6ad" font-size="16" font-weight="400">Your credentials</text><text x="632" y="390" fill="#a6a6ad" font-size="16" font-weight="400">Live checks pending</text><rect x="896" y="184" width="260" height="250" rx="20" fill="#151518" stroke="#303036"/><text x="916" y="225" fill="#ffffff" font-size="24" font-weight="700">Custom</text><text x="916" y="270" fill="#a6a6ad" font-size="16" font-weight="400">Your /ocr endpoint</text><text x="916" y="310" fill="#a6a6ad" font-size="16" font-weight="400">Your endpoint</text><text x="916" y="350" fill="#a6a6ad" font-size="16" font-weight="400">Adapter contract</text><text x="916" y="390" fill="#a6a6ad" font-size="16" font-weight="400">Service-specific</text><text x="44" y="467" fill="#a6a6ad" font-size="15" font-weight="400">Free-tier planning scenarios are documented separately. Tesseract needs no provider key.</text></g></svg>
