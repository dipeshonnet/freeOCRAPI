<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-label="Quantified free-tier planning capacity"><title>Quantified free-tier planning capacity</title><desc>Checked 2026-10-29 · 30-day scenarios · eligible accounts required; not live balances</desc><rect width="1200" height="790" rx="28" fill="#0b0b0d"/><g font-family="Arial,Helvetica,sans-serif"><text x="44" y="51" fill="#8b8b94" font-size="14" font-weight="600">freeOCRAPI / LOCAL-FIRST DOCUMENT PROCESSING</text><text x="44" y="108" fill="#fafafa" font-size="36" font-weight="700">Quantified free-tier planning capacity</text><text x="44" y="146" fill="#a6a6ad" font-size="18" font-weight="400">Checked 2026-10-29 · 30-day scenarios · eligible accounts required; not live balances</text><rect x="44" y="183" width="356" height="150" rx="20" fill="#151518" stroke="#303036"/><text x="64" y="243" fill="#fff" font-size="46" font-weight="700">26,500</text><text x="64" y="282" fill="#d4d4db" font-size="13" font-weight="600">SINGLE-PAGE EQUIVALENTS</text><text x="64" y="311" fill="#a6a6ad" font-size="12" font-weight="400">Four quantified recurring cloud allowances</text><rect x="422" y="183" width="356" height="150" rx="20" fill="#151518" stroke="#303036"/><text x="442" y="243" fill="#fff" font-size="46" font-weight="700">56,500</text><text x="442" y="282" fill="#d4d4db" font-size="13" font-weight="600">PACKED-PDF PAGE CEILING</text><text x="442" y="311" fill="#a6a6ad" font-size="12" font-weight="400">Every OCR.space request: 3 PDF pages / 1 MB</text><rect x="800" y="183" width="356" height="150" rx="20" fill="#151518" stroke="#303036"/><text x="820" y="243" fill="#fff" font-size="46" font-weight="700">+1,000</text><text x="820" y="282" fill="#d4d4db" font-size="13" font-weight="600">TEXTRACT PAGES / MONTH</text><text x="820" y="311" fill="#a6a6ad" font-size="12" font-weight="400">Eligible new customers, first 3 months only</text><text x="44" y="378" fill="#fff" font-size="20" font-weight="600">Single-page equivalents per 30-day planning month</text><text x="44" y="440" fill="#a6a6ad" font-size="16" font-weight="400">LlamaParse</text><rect x="285" y="420" width="490" height="28" rx="5" fill="#bcbcc7"/><text x="1044" y="441" fill="#fff" font-size="16" font-weight="600">10,000</text><text x="44" y="496" fill="#a6a6ad" font-size="16" font-weight="400">OCR.space</text><rect x="285" y="476" width="735" height="28" rx="5" fill="#bcbcc7"/><text x="1044" y="497" fill="#fff" font-size="16" font-weight="600">15,000</text><text x="44" y="552" fill="#a6a6ad" font-size="16" font-weight="400">Azure Document Intelligence</text><rect x="285" y="532" width="24.5" height="28" rx="5" fill="#bcbcc7"/><text x="1044" y="553" fill="#fff" font-size="16" font-weight="600">500</text><text x="44" y="608" fill="#a6a6ad" font-size="16" font-weight="400">Google Document AI</text><rect x="285" y="588" width="49" height="28" rx="5" fill="#bcbcc7"/><text x="1044" y="609" fill="#fff" font-size="16" font-weight="600">1,000</text><text x="44" y="677" fill="#a6a6ad" font-size="16" font-weight="400">LlamaParse Fast: 1 credit/page. OCR.space: min(25,000/month, 500/day × 30) requests.</text><text x="44" y="710" fill="#a6a6ad" font-size="15" font-weight="400">3 self-hosted engines: no provider credit meter; hardware limits/costs apply. Mistral/custom: unquantified.</text><text x="44" y="743" fill="#a6a6ad" font-size="15" font-weight="400">Independent quotas, not one shared credit pool. Sources, limits and scenario calculations are in the README.</text></g></svg>
