<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="Choose where recognition happens."><title>Choose where recognition happens.</title><desc>10 implemented adapters. Formats and capabilities depend on the configured engine.</desc><rect width="1200" height="520" rx="28" fill="#0b0b0d"/><g font-family="Arial,Helvetica,sans-serif"><text x="44" y="51" fill="#8b8b94" font-size="14" font-weight="600">freeOCRAPI / LOCAL-FIRST DOCUMENT PROCESSING</text><text x="44" y="108" fill="#fafafa" font-size="36" font-weight="700">Choose where recognition happens.</text><text x="44" y="146" fill="#a6a6ad" font-size="18" font-weight="400">10 implemented adapters. Formats and capabilities depend on the configured engine.</text><rect x="44" y="184" width="356" height="286" rx="20" fill="#151518" stroke="#303036"/><text x="66" y="224" fill="#ffffff" font-size="24" font-weight="700">3 local options</text><text x="66" y="262" fill="#a6a6ad" font-size="17" font-weight="400">Tesseract — built in</text><text x="66" y="290" fill="#a6a6ad" font-size="17" font-weight="400">PaddleOCR — optional service</text><text x="66" y="318" fill="#a6a6ad" font-size="17" font-weight="400">Docling — optional service</text><text x="66" y="448" fill="#a6a6ad" font-size="12" font-weight="400">Built-in verified; sidecar runtime checks pending.</text><rect x="422" y="184" width="356" height="286" rx="20" fill="#151518" stroke="#303036"/><text x="444" y="224" fill="#ffffff" font-size="24" font-weight="700">6 cloud adapters</text><text x="444" y="262" fill="#a6a6ad" font-size="17" font-weight="400">LlamaParse</text><text x="444" y="290" fill="#a6a6ad" font-size="17" font-weight="400">Mistral OCR</text><text x="444" y="318" fill="#a6a6ad" font-size="17" font-weight="400">OCR.space</text><text x="444" y="346" fill="#a6a6ad" font-size="17" font-weight="400">Azure Document Intelligence</text><text x="444" y="374" fill="#a6a6ad" font-size="17" font-weight="400">Google Document AI</text><text x="444" y="402" fill="#a6a6ad" font-size="17" font-weight="400">Amazon Textract</text><text x="444" y="448" fill="#a6a6ad" font-size="12" font-weight="400">Fixtures; live accounts not verified.</text><rect x="800" y="184" width="356" height="286" rx="20" fill="#151518" stroke="#303036"/><text x="822" y="224" fill="#ffffff" font-size="24" font-weight="700">1 custom contract</text><text x="822" y="262" fill="#a6a6ad" font-size="17" font-weight="400">Your HTTP(S) OCR endpoint</text><text x="822" y="290" fill="#a6a6ad" font-size="17" font-weight="400">POST /ocr</text><text x="822" y="318" fill="#a6a6ad" font-size="17" font-weight="400">Normalized page results</text><text x="822" y="448" fill="#a6a6ad" font-size="12" font-weight="400">Connect a service you control.</text></g></svg>
